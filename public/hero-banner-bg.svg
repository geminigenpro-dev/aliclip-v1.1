<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#0b1226" />
      <stop offset="75%" stop-color="#11183c" />
      <stop offset="100%" stop-color="#180d38" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="85%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowAmber" cx="35%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Matrix Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>

    <!-- Linear Gradients for Waves and Ribbons -->
    <linearGradient id="streamWave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="streamWave2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Base Solid & Gradient -->
  <rect width="1920" height="600" fill="url(#bgGradient)" />

  <!-- Ambient Glow Spheres -->
  <rect width="1920" height="600" fill="url(#glowCyan)" />
  <rect width="1920" height="600" fill="url(#glowPurple)" />
  <rect width="1920" height="600" fill="url(#glowAmber)" />

  <!-- Perspective Digital Grid at Bottom -->
  <rect y="250" width="1920" height="350" fill="url(#cyberGrid)" opacity="0.8" />
  
  <!-- Perspective Lines towards horizon -->
  <g stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12">
    <line x1="960" y1="260" x2="0" y2="600" />
    <line x1="960" y1="260" x2="240" y2="600" />
    <line x1="960" y1="260" x2="480" y2="600" />
    <line x1="960" y1="260" x2="720" y2="600" />
    <line x1="960" y1="260" x2="960" y2="600" />
    <line x1="960" y1="260" x2="1200" y2="600" />
    <line x1="960" y1="260" x2="1440" y2="600" />
    <line x1="960" y1="260" x2="1680" y2="600" />
    <line x1="960" y1="260" x2="1920" y2="600" />
  </g>

  <!-- STREAMING RIBBONS & WAVES (Representing Video / Media Streams) -->
  <path d="M 600 -50 C 900 150, 1100 50, 1400 280 C 1650 480, 1800 350, 2000 450" 
        fill="none" stroke="url(#streamWave1)" stroke-width="6" filter="url(#neonBlur)" opacity="0.65" />
  <path d="M 650 -20 C 930 180, 1120 80, 1420 300 C 1670 490, 1820 370, 2020 470" 
        fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.85" />

  <path d="M 450 650 C 800 400, 1200 550, 1500 220 C 1750 -40, 1850 150, 2000 100" 
        fill="none" stroke="url(#streamWave2)" stroke-width="8" filter="url(#neonBlur)" opacity="0.45" />
  <path d="M 460 640 C 810 395, 1210 540, 1510 215 C 1755 -30, 1855 160, 2010 110" 
        fill="none" stroke="#e879f9" stroke-width="1.5" opacity="0.75" />

  <!-- Stylized Filmstrip Perforated Stream Ribbon -->
  <g opacity="0.25" stroke="#a78bfa" stroke-width="1" fill="none">
    <path d="M 1100 120 C 1300 200, 1500 150, 1850 350" stroke-dasharray="12, 10" stroke-width="2" />
    <path d="M 1110 140 C 1310 220, 1510 170, 1860 370" stroke-dasharray="12, 10" stroke-width="2" />
  </g>

  <!-- ARTIFICIAL INTELLIGENCE NEURAL NETWORK (Constellation Graph) -->
  <g opacity="0.7">
    <!-- Neural Node Connections -->
    <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35">
      <line x1="1350" y1="180" x2="1480" y2="120" />
      <line x1="1480" y1="120" x2="1620" y2="160" />
      <line x1="1480" y1="120" x2="1520" y2="240" />
      <line x1="1620" y1="160" x2="1750" y2="100" />
      <line x1="1620" y1="160" x2="1660" y2="280" />
      <line x1="1520" y1="240" x2="1660" y2="280" />
      <line x1="1660" y1="280" x2="1820" y2="250" />
      <line x1="1750" y1="100" x2="1880" y2="150" />
      <line x1="1820" y1="250" x2="1880" y2="150" />
      <line x1="1350" y1="180" x2="1420" y2="300" />
      <line x1="1420" y1="300" x2="1520" y2="240" />
      <line x1="1660" y1="280" x2="1720" y2="390" />
      <line x1="1820" y1="250" x2="1720" y2="390" />
    </g>

    <!-- Glowing Synaptic Hubs / Nodes -->
    <circle cx="1350" cy="180" r="4" fill="#38bdf8" />
    <circle cx="1480" cy="120" r="6" fill="#00f2fe" filter="url(#neonBlur)" />
    <circle cx="1480" cy="120" r="3" fill="#ffffff" />
    <circle cx="1620" cy="160" r="7" fill="#818cf8" filter="url(#neonBlur)" />
    <circle cx="1620" cy="160" r="3.5" fill="#ffffff" />
    <circle cx="1520" cy="240" r="5" fill="#38bdf8" />
    <circle cx="1520" cy="240" r="2.5" fill="#ffffff" />
    <circle cx="1750" cy="100" r="6" fill="#c084fc" filter="url(#neonBlur)" />
    <circle cx="1750" cy="100" r="3" fill="#ffffff" />
    <circle cx="1660" cy="280" r="6.5" fill="#06b6d4" filter="url(#neonBlur)" />
    <circle cx="1660" cy="280" r="3.5" fill="#ffffff" />
    <circle cx="1820" cy="250" r="5" fill="#818cf8" />
    <circle cx="1880" cy="150" r="5.5" fill="#38bdf8" />
    <circle cx="1420" cy="300" r="4" fill="#818cf8" />
    <circle cx="1720" cy="390" r="4.5" fill="#c084fc" />

    <!-- Secondary subtle constellation on the top right -->
    <circle cx="1200" cy="80" r="3" fill="#38bdf8" opacity="0.6" />
    <line x1="1200" y1="80" x2="1350" y2="180" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" />
  </g>

  <!-- HOLOGRAPHIC STREAMING & AI BADGE ELEMENTS (Floating subtly in background) -->
  <!-- 3D Play Button Prism (Streaming motif) -->
  <g transform="translate(1550, 180) scale(0.9)" opacity="0.25">
    <polygon points="40,20 120,70 40,120" fill="url(#neonCyan)" filter="url(#softGlow)" />
    <polygon points="40,20 120,70 40,120" fill="none" stroke="#38bdf8" stroke-width="3" />
    <polygon points="55,38 105,70 55,102" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- AI Brain / Spark Sparkle Hologram -->
  <g transform="translate(1700, 70) scale(0.85)" opacity="0.3">
    <path d="M 50 10 L 60 40 L 90 50 L 60 60 L 50 90 L 40 60 L 10 50 L 40 40 Z" fill="#c084fc" filter="url(#softGlow)" />
    <path d="M 50 10 L 60 40 L 90 50 L 60 60 L 50 90 L 40 60 L 10 50 L 40 40 Z" fill="#ffffff" />
  </g>

  <g transform="translate(1380, 260) scale(0.6)" opacity="0.25">
    <path d="M 50 10 L 60 40 L 90 50 L 60 60 L 50 90 L 40 60 L 10 50 L 40 40 Z" fill="#38bdf8" filter="url(#softGlow)" />
    <path d="M 50 10 L 60 40 L 90 50 L 60 60 L 50 90 L 40 60 L 10 50 L 40 40 Z" fill="#ffffff" />
  </g>

  <!-- Digital Audio & Visual Spectrum Bars (Media Streaming) -->
  <g transform="translate(1780, 360)" opacity="0.35" fill="url(#streamWave1)">
    <rect x="0" y="20" width="4" height="40" rx="2" />
    <rect x="10" y="5" width="4" height="55" rx="2" />
    <rect x="20" y="30" width="4" height="30" rx="2" />
    <rect x="30" y="10" width="4" height="50" rx="2" />
    <rect x="40" y="0" width="4" height="60" rx="2" />
    <rect x="50" y="18" width="4" height="42" rx="2" />
    <rect x="60" y="28" width="4" height="32" rx="2" />
    <rect x="70" y="12" width="4" height="48" rx="2" />
  </g>

  <!-- Subtle Floating Sparkle Particles -->
  <circle cx="280" cy="140" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="450" cy="80" r="1" fill="#c084fc" opacity="0.3" />
  <circle cx="820" cy="190" r="1.5" fill="#fbbf24" opacity="0.4" />
  <circle cx="1050" cy="110" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="1280" cy="220" r="1.5" fill="#e879f9" opacity="0.4" />
  <circle cx="1450" cy="70" r="2" fill="#22d3ee" opacity="0.6" />
  <circle cx="1600" cy="330" r="1.5" fill="#38bdf8" opacity="0.4" />
  <circle cx="1780" cy="180" r="2" fill="#fde047" opacity="0.5" />

  <!-- LEFT TEXT SCRIM (Gradient dark overlay to ensure 100% text readability) -->
  <rect width="1200" height="600" fill="url(#leftScrim)" />
  <defs>
    <linearGradient id="leftScrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050814" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#050814" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#050814" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Bottom Edge Subtle Horizon Glow -->
  <line x1="0" y1="599" x2="1920" y2="599" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
</svg>
