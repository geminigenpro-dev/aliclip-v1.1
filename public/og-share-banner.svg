<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Neon Accents -->
    <radialGradient id="cyanGlow" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Logo / Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Luminous Ambient Orbs -->
  <rect width="1200" height="630" fill="url(#cyanGlow)" />
  <rect width="1200" height="630" fill="url(#indigoGlow)" />
  <rect width="1200" height="630" fill="url(#purpleGlow)" />

  <!-- Geometric Tech Grid Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="490" x2="1200" y2="490" />
    <line x1="0" y1="560" x2="1200" y2="560" />

    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
  </g>

  <!-- Frame Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />
  <rect x="25" y="25" width="1150" height="580" rx="27" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1" />

  <!-- Top Pill: Status / Official Store -->
  <g transform="translate(80, 75)">
    <rect width="270" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#10b981" filter="url(#subtleGlow)" />
    <text x="38" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">TIENDA DIGITAL OFICIAL</text>
  </g>

  <!-- Delivery Badge -->
  <g transform="translate(370, 75)">
    <rect width="250" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <text x="24" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">⚡ ENTREGA EN 3 MINUTOS</text>
  </g>

  <!-- Main Brand Title -->
  <g transform="translate(80, 210)">
    <!-- Brand Icon -->
    <rect x="0" y="-62" width="76" height="76" rx="22" fill="url(#titleGrad)" />
    <path d="M38 -46 L45 -28 L63 -28 L48 -17 L54 1 L38 -10 L22 1 L28 -17 L13 -28 L31 -28 Z" fill="#0b0f19" />

    <text x="96" y="-5" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-2" filter="url(#subtleGlow)">
      AliClip
    </text>
    <text x="365" y="-5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="300">
      .site
    </text>
  </g>

  <!-- Tagline / Headline -->
  <text x="80" y="275" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Cuentas Premium de Streaming &amp; Membresías IA
  </text>

  <!-- Subheadline -->
  <text x="80" y="325" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
    ChatGPT Plus • Netflix 4K • Midjourney • Claude Pro • Canva Pro • Disney+ • Spotify
  </text>
  <text x="80" y="358" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
    Activación inmediata por WhatsApp • Garantía total de servicio • Perú &amp; Latinoamérica
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(80, 410)">
    <!-- Card 1: ChatGPT -->
    <g transform="translate(0, 0)">
      <rect width="235" height="135" rx="20" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#059669" fill-opacity="0.2" />
      <text x="28" y="44" fill="#34d399" font-size="20">🤖</text>
      <text x="68" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">ChatGPT Plus</text>
      <text x="68" y="55" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">GPT-4o Ilimitado</text>
      <text x="18" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Perfil privado con PIN</text>
      <text x="18" y="118" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Entrega Inmediata</text>
    </g>

    <!-- Card 2: Netflix -->
    <g transform="translate(255, 0)">
      <rect width="235" height="135" rx="20" fill="url(#cardGrad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#dc2626" fill-opacity="0.2" />
      <text x="28" y="44" fill="#f87171" font-size="20">🎬</text>
      <text x="68" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Netflix Ultra HD</text>
      <text x="68" y="55" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Calidad 4K HDR</text>
      <text x="18" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Sin caídas ni bloqueos</text>
      <text x="18" y="118" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Garantía Renovable</text>
    </g>

    <!-- Card 3: Midjourney / Claude -->
    <g transform="translate(510, 0)">
      <rect width="235" height="135" rx="20" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#9333ea" fill-opacity="0.2" />
      <text x="28" y="44" fill="#c084fc" font-size="20">🎨</text>
      <text x="68" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Midjourney &amp; IA</text>
      <text x="68" y="55" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Modo Fast GPU</text>
      <text x="18" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Diseño y Video Gen</text>
      <text x="18" y="118" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Activación Rápida</text>
    </g>

    <!-- Card 4: Payments / Trust -->
    <g transform="translate(765, 0)">
      <rect width="275" height="135" rx="20" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#0284c7" fill-opacity="0.2" />
      <text x="28" y="44" fill="#38bdf8" font-size="20">🇵🇪</text>
      <text x="68" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Medios de Pago</text>
      <text x="68" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Yape, Plin, BCP, USDT</text>
      <text x="18" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">+15,000 Clientes Felices</text>
      <text x="18" y="118" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">⭐ 4.9/5 Reputación</text>
    </g>
  </g>

  <!-- Bottom Right Domain URL watermark -->
  <g transform="translate(930, 98)">
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="1">aliclip.site</text>
  </g>
</svg>
