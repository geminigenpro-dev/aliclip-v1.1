    <script>
      (function() {
        // Suppress benign iframe WebSocket HMR reconnection errors in AI Studio preview
        var isWsError = function(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || val.stack || String(val) || '');
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('websocket') !== -1 ||
                 str.indexOf('[vite]') !== -1 ||
                 str.indexOf('closed without opened') !== -1;
        };

        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || isWsError(e.error)) {
            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
          }
        }, true);

        // Filter out benign Vite WebSocket warnings from the console
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsError(arguments[i])) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsError(arguments[i])) {
              return;
            }
          }
          return origConsoleWarn.apply(console, arguments);
        };

        try {
          var stored = localStorage.getItem('alixplay_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
